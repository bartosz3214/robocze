services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-app}-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ${APP_PATH:-.}:/var/www/html:cached
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      NGINX_ROOT: ${NGINX_ROOT:-/var/www/html}
      PHP_UPSTREAM: php:9000
      NGINX_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-32M}
    networks: [app]

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-app}-php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ${APP_PATH:-.}:/var/www/html:cached
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-32M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-32M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-60}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-1}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:app@mysql:3306/app}
    networks: [app]

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ${COMPOSE_PROJECT_NAME:-app}-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [app]

volumes:
  mysql-data:

networks:
  app:
